<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jutyar Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="motion.css">
</head>
<body class="loading">
<!-- passive progress: loading (green) and scroll (gold) -->
<div class="progress"><i id="loadBar"></i><i id="scrollBar"></i></div>

<!-- preloader: curtain with the Grain Sun drawing itself, branded words, 00 to 100 counter, kinetic marquee -->
<div id="pre" class="pre" aria-hidden="true">
  <div class="pre-center">
    <div id="preSun"></div>
    <div class="pre-word"><span id="preWord" class="wght">Jutyar</span><span class="pre-ku">جوتیار</span></div>
    <div class="pre-say"><span id="preSay">Waking up</span></div>
  </div>
  <div class="pre-count"><span id="preCount">00</span><small>%</small></div>
  <div class="pre-marquee"><div id="preMarquee" class="mq-track"></div></div>
  <div class="pre-skip">Press any key to skip</div>
</div>
<!-- bento blinds under the curtain: they flip open after it lifts -->
<div id="bento" class="bento" aria-hidden="true"></div>

<div class="demo-bar">Demo of the Jutyar Control Room. Sample data, nothing is saved or sent. Real map borders from <code>web/map_demo</code>.</div>
<header class="top">
  <a class="brand" href="#overview"><span class="mark" id="brandSun"></span><span>Jutyar</span><span class="tag">Control room</span></a>
  <button class="search-btn" id="searchBtn"><i data-lucide="search"></i><span>Search farms, officers, settings</span><kbd>/</kbd></button>
  <div class="top-right">
    <span class="env" title="This server answers with sample data">DEMO</span>
    <button class="icon-btn magnetic" id="approvalsBtn" title="Waiting for your approval"><i data-lucide="stamp"></i><span class="dot" id="approvalsCount">0</span></button>
    <div class="lang"><button class="on">EN</button><button>سۆرانی</button></div>
    <button class="who" id="whoBtn"><span class="avatar" id="whoAvatar">KA</span><span class="who-text"><b id="whoName">Karwan Aziz</b><small id="whoRole">Admin</small></span><i data-lucide="chevron-down"></i></button>
    <div class="menu" id="whoMenu" hidden></div>
  </div>
</header>
<!-- kinetic marquee: live news, faster while loading and while scrolling -->
<div class="ticker"><span class="ticker-tag"><i class="live"></i>Live</span><div class="ticker-win"><div id="ticker" class="mq-track"></div></div></div>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="modal-bg" id="modalBg" hidden><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<div id="cursorDot" class="cursor-dot"></div><div id="cursorRing" class="cursor-ring"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="../map_demo/kri_map_data.js"></script>
<script src="motion.js"></script>
<script src="admin.js"></script>
</body>
</html>
