[package]
name = "farm-doctor-api"
version = "0.1.0"
edition = "2024"

[build-dependencies]
dotenvy = "0.15.7"

[dependencies]
axum = { version = "0.8.9", features = ["tokio"] }
dotenvy = "0.15.7"
sea-orm = { version = "2.0.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "debug-print",
] }
sea-orm-migration = { version = "2.0.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "registry",
  "json",
] }

migration = { path = "migration" }
thiserror = "2.0.21"
validator = { version = "0.20.0", features = ["derive"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "with-rejection"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
async-trait = "0.1.91"
mimalloc = { version = "0.1", features = ["secure"] }
clap = { version = "4.6", features = ["derive"] }
getset = "0.1.6"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "grpc-tonic",
  "trace",
] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "trace"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing-opentelemetry = "0.33"

# OpenAPI/Swagger documentation
utoipa = { version = "6.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
chrono = { version = "0.4.45", features = ["serde"] }
